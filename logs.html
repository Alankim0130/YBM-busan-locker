<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>신청 기록 · 서면 YBM 사물함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="logpage" id="page" hidden>
    <div class="logpage-top">
      <div class="lt-left">
        <a class="log-back" href="admin.html">← 관리 화면</a>
        <h1>신청 기록</h1>
      </div>
      <div class="logpage-actions">
        <button class="btn" id="editBtn">편집</button>
      </div>
    </div>

    <div class="ym-bar">
      <button class="ym-nav" id="prevY" aria-label="이전 해">‹</button>
      <span class="ym-year" id="ymYear">—</span>
      <button class="ym-nav" id="nextY" aria-label="다음 해">›</button>
      <span class="ym-info" id="lead"></span>
    </div>
    <div class="month-bar" id="monthBar"></div>

    <div id="tableArea"></div>
  </div>

  <div class="log-empty" id="msg">불러오는 중…</div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";
    var URL = window.SUPABASE_URL, KEY = window.SUPABASE_ANON_KEY;
    var $ = function (id) { return document.getElementById(id); };
    if (!URL || !KEY || URL.indexOf("YOUR-") !== -1 || KEY.indexOf("YOUR-") !== -1) {
      $("msg").textContent = "설정이 필요합니다. config.js 를 확인하세요."; return;
    }
    var sb = window.supabase.createClient(URL, KEY);

    var META = {
      rent:   { t: "입금", c: "in" },
      return: { t: "환급", c: "out" },
      extend: { t: "연장", c: "ext" },
      move:   { t: "이동", c: "mv" }
    };
    var ACTIONS = ["rent", "return", "extend", "move"];

    var editMode = false, ROWS = [], curY, curM; // curM: 1-12

    function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m];}); }
    var fmtD = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" });
    var fmtT = new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", hour12: false });
    function ymd(ts){ return fmtD.format(new Date(ts)); }   // 'YYYY-MM-DD'
    function hm(ts){ return fmtT.format(new Date(ts)); }    // 'HH:MM'
    function lockerOf(l){ return l.lockers ? (l.lockers.floor + "층 " + l.lockers.number + "번") : "—"; }

    /* 1년 지난 기록 자동 정리(무료 용량 절약) */
    function cleanupOld() {
      var d = new Date(); d.setFullYear(d.getFullYear() - 1);
      return sb.from("rental_logs").delete().lt("created_at", d.toISOString()).then(function(){}, function(){});
    }

    function load() {
      sb.from("rental_logs").select("id, action, detail, created_at, lockers(floor, number)")
        .in("action", ACTIONS).order("created_at", { ascending: false }).limit(8000)
        .then(function (res) {
          if (res.error) { $("page").hidden = true; $("msg").hidden = false; $("msg").textContent = "기록을 불러오지 못했습니다: " + res.error.message; return; }
          ROWS = res.data || [];
          $("msg").hidden = true; $("page").hidden = false;
          render();
        });
    }

    function monthCounts(year) {
      var c = {};
      ROWS.forEach(function (l) { var p = ymd(l.created_at).split("-"); if (+p[0] === year) { var m = +p[1]; c[m] = (c[m] || 0) + 1; } });
      return c;
    }

    function render() {
      $("ymYear").textContent = curY + "년";
      var counts = monthCounts(curY);
      var totalY = Object.keys(counts).reduce(function (s, k) { return s + counts[k]; }, 0);
      $("lead").textContent = "한국시간 · " + curY + "년 " + totalY + "건";
      var mb = $("monthBar"); mb.innerHTML = "";
      for (var m = 1; m <= 12; m++) {
        var has = counts[m] || 0;
        var b = document.createElement("button");
        b.className = "mbtn" + (m === curM ? " active" : "") + (has ? " has" : "");
        b.innerHTML = m + "월" + (has ? '<span class="mb-cnt">' + has + "</span>" : "");
        (function (mm) { b.onclick = function () { curM = mm; render(); }; })(m);
        mb.appendChild(b);
      }
      renderTable(counts[curM] || 0);
    }

    function renderTable(count) {
      var area = $("tableArea");
      if (!count) { area.innerHTML = '<div class="log-empty">' + curY + "년 " + curM + "월 기록이 없습니다.</div>"; return; }
      var rows = ROWS.filter(function (l) { var p = ymd(l.created_at).split("-"); return +p[0] === curY && +p[1] === curM; });
      var html = '<div class="log-scroll"><table class="log-table"><thead><tr>' +
        "<th>구분</th><th>이름</th><th>생년월일</th><th>반</th><th>사물함</th><th>날짜</th><th>시간</th>" +
        (editMode ? "<th>삭제</th>" : "") + "</tr></thead><tbody>";
      rows.forEach(function (l) {
        var d = l.detail || {};
        var meta = META[l.action] || { t: l.action, c: "mv" };
        html += "<tr>" +
          '<td><span class="log-badge ' + meta.c + '">' + meta.t + "</span></td>" +
          '<td class="c-name">' + esc(d.student_name || "") + "</td>" +
          '<td class="c-mono">' + esc(d.birth || "") + "</td>" +
          "<td>" + esc(d.class_label || "") + "</td>" +
          '<td class="c-locker">' + esc(lockerOf(l)) + "</td>" +
          '<td class="c-mono">' + ymd(l.created_at).replace(/-/g, ".") + "</td>" +
          '<td class="c-mono">' + hm(l.created_at) + "</td>" +
          (editMode ? '<td><button class="log-del" data-id="' + l.id + '">삭제</button></td>' : "") +
          "</tr>";
      });
      html += "</tbody></table></div>";
      area.innerHTML = html;
      if (editMode) {
        var btns = area.querySelectorAll(".log-del");
        rows.forEach(function (l, i) { btns[i].onclick = function () { removeLog(l); }; });
      }
    }

    function removeLog(l) {
      var d = l.detail || {};
      var meta = META[l.action] || { t: l.action };
      if (!window.confirm("이 기록을 삭제할까요?\n\n" + meta.t + " / " + (d.student_name || "") + " / " + lockerOf(l) + " / " + ymd(l.created_at))) return;
      sb.from("rental_logs").delete().eq("id", l.id).then(function (res) {
        if (res.error) { alert("삭제 실패: " + res.error.message); return; }
        ROWS = ROWS.filter(function (x) { return x.id !== l.id; });
        render();
      });
    }

    $("editBtn").onclick = function () {
      editMode = !editMode;
      $("editBtn").textContent = editMode ? "완료" : "편집";
      $("editBtn").classList.toggle("primary", editMode);
      render();
    };
    $("prevY").onclick = function () { curY--; render(); };
    $("nextY").onclick = function () { curY++; render(); };

    /* 인증 확인 후 시작 — 기본 연/월 = 오늘(한국시간) */
    var todayParts = ymd(Date.now()).split("-");
    curY = +todayParts[0]; curM = +todayParts[1];
    sb.auth.getSession().then(function (res) {
      if (!res.data || !res.data.session) { location.replace("admin.html"); return; }
      cleanupOld().then(load);
    });
  })();
  </script>
</body>
</html>
