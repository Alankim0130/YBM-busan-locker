<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>YBM 네이버 예약 알림 설치</title>
<style>

  html,body{margin:0;}
  body{background:#eaeef3;color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;word-break:keep-all;
    min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  .box{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px 24px;text-align:center;
    box-shadow:0 8px 24px rgba(16,24,40,.10);}
  img{height:42px;width:auto;display:block;margin:0 auto 14px;}
  h1{font-size:21px;margin:0 0 22px;}
  .dl{display:block;padding:15px 18px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;font-weight:700;font-size:16.5px;}
  .dl:hover{background:var(--brand-2);}
  p{margin:18px 0 0;font-size:15px;line-height:1.6;}
</style>
</head>
<body>
  <div class="box">
    <img src="/assets/ybm-logo.png" alt="YBM" onerror="this.style.display='none'">
