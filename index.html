<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>서면 YBM 사물함 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaeef3; --surface:#fff; --surface-2:#f6f8fb; --line:#e2e7ee; --line-strong:#cfd7e1;
    --ink:#19212e; --ink-2:#586273; --ink-3:#8b94a3; --brand:#1d2531; --brand-2:#0f1520;
    --free:#2f9e6e; --rent:#3b6fd4;
    --r:12px; --r-lg:16px;
    --sh-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.05);
    --sh-md:0 8px 24px rgba(16,24,40,.10);
    --sh-lg:0 20px 50px rgba(16,24,40,.16);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{background:radial-gradient(120% 120% at 50% 0%,#f1f4f8 0%,#e6eaf0 60%,#e1e6ed 100%);
    color:var(--ink);font-family:"Inter",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
    min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));}
  .home{width:100%;max-width:820px;}
  .top{text-align:center;margin-bottom:34px;}
  .mark{width:60px;height:60px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(150deg,#2a3342,#141a24);display:grid;place-items:center;
    color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:28px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.14),var(--sh-md);}
  .brand-logo{height:52px;width:auto;display:block;margin:0 auto 18px;}
  .top h1{font-family:"Space Grotesk";font-weight:600;font-size:25px;letter-spacing:.02em;margin:0;}
  .top p{margin:8px 0 0;font-size:14px;color:var(--ink-2);letter-spacing:.01em;}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-lg);padding:26px 24px;box-shadow:var(--sh-sm);text-decoration:none;color:inherit;
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;min-height:236px;}
  .card:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--line-strong);}
  .card:active{transform:translateY(-1px);}
  .ico{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;}
  .ico svg{width:26px;height:26px;}
  .ico.staff{background:#e9eefb;color:var(--rent);}
  .ico.student{background:#e4f4ec;color:var(--free);}
  .card h2{font-family:"Space Grotesk";font-weight:600;font-size:19px;margin:0 0 7px;}
  .card .desc{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin:0 0 auto;}
  .go{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;font-weight:600;}
  .go.staff{color:var(--brand);}
  .go.student{color:var(--free);}
  .go .arrow{transition:transform .16s ease;}
  .card:hover .go .arrow{transform:translateX(4px);}
  .tag{align-self:flex-start;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);
    border:1px solid var(--line);border-radius:99px;padding:4px 10px;margin-bottom:16px;}
  footer{text-align:center;margin-top:30px;font-size:12px;color:var(--ink-3);line-height:1.7;}
  @media (max-width:620px){
    .cards{grid-template-columns:1fr;}
    .card{min-height:0;}
    .top{margin-bottom:26px;}
  }
</style>
</head>
<body>
  <div class="home">
    <div class="top">
      <img class="brand-logo" src="assets/ybm-logo.png" alt="YBM 어학원 서면">
      <h1>서면 YBM 사물함</h1>
      <p>이용하실 화면을 선택하세요.</p>
    </div>

    <div class="cards">
      <a class="card" href="admin.html">
        <span class="tag">직원 전용</span>
        <div class="ico staff">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2>직원 로그인</h2>
        <p class="desc">사물함 대여·반납·이동, 반/종강일 관리, 특별공지. 로그인이 필요합니다.</p>
        <span class="go staff">로그인하기 <span class="arrow">→</span></span>
      </a>

      <a class="card" href="student.html">
        <span class="tag">학생용 · 로그인 불필요</span>
        <div class="ico student">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
            <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
          </svg>
        </div>
        <h2>빈자리 보기</h2>
        <p class="desc">지금 비어 있는 사물함을 실시간으로 확인하세요. 원하는 번호를 데스크에 신청하면 됩니다.</p>
        <span class="go student">빈자리 확인 <span class="arrow">→</span></span>
      </a>
    </div>

    <footer>서면 YBM 어학원 · 사물함 관리 시스템</footer>
  </div>
</body>
</html>
