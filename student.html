<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>서면 YBM 사물함 빈자리 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#e9edf1; --paper:#f6f8fa; --ink:#1b2430; --ink-soft:#5a6675;
    --line:#cbd3dc; --free:#3ba776; --used:#aeb8c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{background:var(--canvas);color:var(--ink);font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px;}
  header{display:flex;align-items:center;gap:11px;padding:6px 2px 14px;}
  .mark{width:34px;height:34px;border-radius:8px;background:var(--ink);display:grid;place-items:center;
    color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:17px;flex-shrink:0;}
  header h1{font-family:"Space Grotesk";font-weight:600;font-size:17px;margin:0;line-height:1.15;}
  header p{margin:3px 0 0;font-size:12px;color:var(--ink-soft);}
  /* 층 탭 */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;position:sticky;top:0;z-index:5;
    background:var(--canvas);scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:11px;
    padding:9px 14px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;line-height:1.1;}
  .tab .tn{font-family:"Space Grotesk";font-weight:600;font-size:15px;}
  .tab .tc{font-size:11px;color:var(--ink-soft);}
  .tab.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .tab.active .tc{color:var(--free);font-weight:600;}
  /* 안내줄 */
  .summary{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin:4px 0 12px;}
  .summary .big{font-family:"Space Grotesk";font-weight:700;font-size:22px;}
  .summary .big b{color:var(--free);}
  .summary .sm{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  /* 범례 */
  .legend{display:flex;gap:16px;align-items:center;margin:0 2px 12px;font-size:12.5px;color:var(--ink-soft);}
  .legend .it{display:flex;align-items:center;gap:7px;}
  .legend .sw{width:16px;height:16px;border-radius:5px;}
  /* 벽 격자 */
  .wall{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 13px;position:relative;}
  .wall-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);opacity:.7;margin-bottom:9px;}
  .grid{display:grid;gap:7px;grid-template-columns:repeat(var(--cols),1fr);}
  .cell{aspect-ratio:1 / .84;border-radius:8px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;border:1px solid transparent;user-select:none;}
  .cell.tall{aspect-ratio:1 / 1.12;}
  .cell .num{font-family:"Space Grotesk";font-weight:700;font-size:clamp(13px,3.6vw,17px);line-height:1;}
  .cell .lab{font-size:clamp(8.5px,2.3vw,10px);font-weight:600;letter-spacing:.02em;}
  .cell.free{background:#e3f3ec;border-color:#bfe3d2;color:#1d7a54;}
  .cell.free .lab{color:#3ba776;}
  .cell.used{background:#eef1f4;border-color:#dde3ea;color:#9aa5b2;}
  .cell.used .num{color:#aab3bf;}
  .cell.used .lab{color:#b3bcc7;}
  /* 상태/푸터 */
  .foot{text-align:center;margin-top:16px;font-size:12px;color:var(--ink-soft);line-height:1.7;}
  .refresh{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;}
  .rbtn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 16px;
    font:inherit;font-size:13px;color:var(--ink);cursor:pointer;}
  .rbtn:active{transform:translateY(1px);}
  .stamp{font-size:11.5px;color:var(--ink-soft);}
  .msg{text-align:center;padding:50px 16px;color:var(--ink-soft);font-size:14px;line-height:1.7;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">L</div>
      <div><h1>사물함 빈자리</h1><p>서면 YBM · 실시간 현황 (개인정보는 표시되지 않습니다)</p></div>
    </header>

    <div id="app" hidden>
      <div class="tabs" id="tabs"></div>
      <div class="summary"><div class="big" id="sumBig">—</div><div class="sm" id="sumSm">원하는 빈자리(초록) 번호를 확인하고 데스크에 말씀해 주세요.</div></div>
      <div class="legend">
        <span class="it"><span class="sw" style="background:#e3f3ec;border:1px solid #bfe3d2"></span>빈자리</span>
        <span class="it"><span class="sw" style="background:#eef1f4;border:1px solid #dde3ea"></span>사용중</span>
      </div>
      <div class="wall">
        <div class="wall-label">벽면 · <span id="wallName">—</span></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="refresh">
        <button class="rbtn" id="refreshBtn">새로고침</button>
        <span class="stamp" id="stamp"></span>
      </div>
      <p class="foot">빈자리 신청·보증금(1만원)은 데스크에서 진행합니다.<br>화면은 30초마다 자동으로 갱신됩니다.</p>
    </div>

    <div class="msg" id="msg">불러오는 중…</div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";
    var URL = window.SUPABASE_URL, KEY = window.SUPABASE_ANON_KEY;
    var $ = function (id) { return document.getElementById(id); };
    if (!URL || !KEY || URL.indexOf("YOUR-") !== -1 || KEY.indexOf("YOUR-") !== -1) {
      $("msg").textContent = "설정이 필요합니다. config.js 에 Supabase 정보를 입력하세요.";
      return;
    }
    var sb = window.supabase.createClient(URL, KEY);

    var FLOORS = [
      { id: 1, name: "1층", cols: 6, rows: 5, start: 1,  tallCount: 0 },
      { id: 2, name: "2층", cols: 5, rows: 5, start: 31, tallCount: 0 },
      { id: 3, name: "3층", cols: 6, rows: 6, start: 56, tallCount: 6 },
      { id: 7, name: "7층", cols: 6, rows: 6, start: 1,  tallCount: 6 }
    ];
    FLOORS.forEach(function (f) { f.total = f.cols * f.rows; f.end = f.start + f.total - 1; });

    var currentId = 1;
    var STATUS = {}; // "floor-number" -> occupied(boolean)
    var loaded = false;

    function pad(n) { return String(n).padStart(2, "0"); }
    function keyOf(fid, n) { return fid + "-" + n; }
    function floorById(id) { return FLOORS.find(function (f) { return f.id === id; }); }

    function freeCount(f) {
      var free = 0;
      for (var n = f.start; n <= f.end; n++) { if (!STATUS[keyOf(f.id, n)]) free++; }
      return free;
    }

    function renderTabs() {
      var t = $("tabs"); t.innerHTML = "";
      FLOORS.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "tab" + (f.id === currentId ? " active" : "");
        b.innerHTML = '<span class="tn">' + f.name + '</span><span class="tc">빈 ' + freeCount(f) + "/" + f.total + "</span>";
        b.onclick = function () { currentId = f.id; render(); };
        t.appendChild(b);
      });
    }

    function renderGrid() {
      var f = floorById(currentId);
      var g = $("grid");
      g.style.setProperty("--cols", f.cols);
      g.innerHTML = "";
      $("wallName").textContent = f.name;
      for (var i = 0; i < f.total; i++) {
        var n = f.start + i;
        var tall = f.tallCount > 0 && i < f.cols; // 맨 윗줄
        var occ = !!STATUS[keyOf(f.id, n)];
        var c = document.createElement("div");
        c.className = "cell " + (occ ? "used" : "free") + (tall ? " tall" : "");
        c.innerHTML = '<span class="num">' + pad(n) + '</span><span class="lab">' + (occ ? "사용중" : "빈자리") + "</span>";
        g.appendChild(c);
      }
    }

    function renderSummary() {
      var f = floorById(currentId);
      $("sumBig").innerHTML = f.name + " 빈자리 <b>" + freeCount(f) + "</b>칸 <span style=\"font-size:14px;color:var(--ink-soft);font-weight:500\">/ 전체 " + f.total + "칸</span>";
    }

    function render() {
      renderTabs(); renderSummary(); renderGrid();
    }

    function stamp() {
      var d = new Date();
      $("stamp").textContent = "업데이트 " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    }

    function load() {
      return sb.from("locker_status").select("floor,number,occupied").then(function (res) {
        if (res.error) {
          if (!loaded) $("msg").textContent = "현황을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.";
          return;
        }
        STATUS = {};
        (res.data || []).forEach(function (r) { STATUS[r.floor + "-" + r.number] = r.occupied; });
        if (!loaded) { loaded = true; $("msg").hidden = true; $("app").hidden = false; }
        render(); stamp();
      });
    }

    $("refreshBtn").onclick = function () { load(); };
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
    setInterval(function () { if (!document.hidden) load(); }, 30000);
    load();
  })();
  </script>
</body>
</html>
