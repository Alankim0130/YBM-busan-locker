<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<title>서면 YBM 사물함 빈자리 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --canvas:#e9edf1; --paper:#f6f8fa; --ink:#1b2430; --ink-soft:#5a6675;
    --line:#cbd3dc; --free:#3ba776; --used:#aeb8c4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:var(--canvas);color:var(--ink);font-family:"Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;}
  .wrap{max-width:600px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 8px);overflow:hidden;}

  /* 상단: 타이틀 */
  header{display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:0 2px 9px;}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;
    color:#fff;font-family:"Space Grotesk";font-weight:700;font-size:15px;flex-shrink:0;}
  header h1{font-family:"Space Grotesk";font-weight:600;font-size:15.5px;margin:0;line-height:1.1;}
  header p{margin:2px 0 0;font-size:11px;color:var(--ink-soft);}

  /* 상단: 층 탭 */
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;flex:0 0 auto;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:10px;
    padding:7px 13px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
    display:flex;align-items:center;gap:7px;line-height:1.1;}
  .tab .tn{font-family:"Space Grotesk";font-weight:600;font-size:14.5px;}
  .tab .tc{font-size:11px;color:var(--ink-soft);}
  .tab.active{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  .tab.active .tc{color:var(--free);font-weight:600;}

  /* 슬림 정보 줄 */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;
    padding:0 3px 8px;}
  .bar .cnt{font-family:"Space Grotesk";font-weight:600;font-size:14px;}
  .bar .cnt b{color:var(--free);font-weight:700;}
  .bar .lg{display:flex;gap:12px;font-size:11.5px;color:var(--ink-soft);}
  .bar .lg .it{display:flex;align-items:center;gap:5px;}
  .bar .lg .sw{width:12px;height:12px;border-radius:4px;}

  /* 하단: 사물함 격자 (남은 화면 꽉 채움) */
  .wall{flex:1 1 auto;min-height:0;background:var(--paper);border:1px solid var(--line);
    border-radius:13px;padding:10px;display:flex;}
  .grid{flex:1;display:grid;gap:5px;min-height:0;
    grid-template-columns:repeat(var(--cols),1fr);}
  .cell{border-radius:6px;display:flex;align-items:center;justify-content:center;
    border:1px solid transparent;min-height:0;min-width:0;overflow:hidden;}
  .cell .num{font-family:"Space Grotesk";font-weight:700;font-size:clamp(10px,4.3vmin,21px);line-height:1;}
  .cell.free{background:#e3f3ec;border-color:#bfe3d2;color:#1d7a54;cursor:pointer;}
  .cell.free:active{transform:scale(.96);}
  .cell.used{background:#eef1f4;border-color:#dde3ea;color:#aeb8c4;}
  .cell.pending{background:#fff3d6;border-color:#ecd28a;color:#9a6a00;}
  .cell.broken{background:#e7eaef;border-color:#cfd5de;color:#8a94a6;
    background-image:repeating-linear-gradient(45deg,rgba(138,148,166,.18) 0 6px,transparent 6px 12px);}
  .cell .cell-cta{font-size:clamp(8px,2.1vmin,10px);font-weight:700;opacity:.85;margin-top:1px;}
  .cell .cell-cta.pend{color:#9a6a00;}
  .cell .cell-cta.brk{color:#8a94a6;}
  /* 신청 시트(모달) */
  .ovl{position:fixed;inset:0;background:rgba(20,27,38,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .ovl.open{display:flex;}
  .sheet{background:#fff;width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    box-shadow:0 -10px 40px rgba(0,0,0,.2);animation:sheetUp .28s cubic-bezier(.22,1,.36,1);}
  @keyframes sheetUp{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
  .sheet h2{font-family:"Space Grotesk";font-weight:600;font-size:19px;margin:0 0 4px;}
  .sheet .sub{font-size:13px;color:var(--ink-soft);margin:0 0 14px;line-height:1.55;}
  .sheet label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:10px 0 5px;}
  .sheet input{width:100%;border:1px solid #cfd7e1;border-radius:10px;padding:12px 13px;font:inherit;font-size:15px;}
  .sheet input:focus{outline:none;border-color:#3b6fd4;box-shadow:0 0 0 3px rgba(59,111,212,.15);}
  .sheet .ferr{color:#d7503a;font-size:12.5px;min-height:18px;margin:9px 0 0;}
  .sheet-btns{display:flex;gap:9px;margin-top:14px;}
  .sbtn{flex:1;border:1px solid #cfd7e1;background:#fff;border-radius:11px;padding:13px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;color:var(--ink);}
  .sbtn.primary{background:#1d2531;color:#fff;border-color:#1d2531;}
  .sbtn:disabled{opacity:.5;}
  .done-ico{width:54px;height:54px;border-radius:50%;background:#e3f3ec;color:#2f9e6e;font-size:28px;font-weight:700;display:grid;place-items:center;margin:0 auto 12px;}
  .done-view .sheet{text-align:center;}
  #doneView .sheet{text-align:center;}
  .done-acct{background:#f6f8fa;border:1px solid #e2e7ee;border-radius:11px;padding:12px;font-size:13px;margin-top:8px;}
  .done-acct b{font-family:"JetBrains Mono",monospace;}

  /* 하단 푸터 */
  .foot{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:12px;
    padding-top:9px;font-size:11.5px;color:var(--ink-soft);}
  .rbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 14px;
    font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer;}
  .rbtn:active{transform:translateY(1px);}
  .msg{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;
    padding:24px;color:var(--ink-soft);font-size:14px;line-height:1.7;}
  /* 보증금 입금 계좌 바 */
  .deposit{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:linear-gradient(150deg,#222c3a,#141b26);color:#fff;border-radius:12px;
    padding:10px 12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(20,27,38,.18);}
  .deposit .dep-txt{font-size:12.5px;line-height:1.45;min-width:0;}
  .deposit .dep-txt b{font-family:"JetBrains Mono",monospace;font-weight:700;letter-spacing:.01em;}
  .deposit .dep-tag{color:#9fb0c4;}
  .dep-copy{flex-shrink:0;border:none;background:#2f9e6e;color:#fff;border-radius:9px;
    padding:9px 14px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;
    box-shadow:0 1px 2px rgba(0,0,0,.2);transition:background .15s,transform .04s;}
  .dep-copy:hover{background:#34b07b;}
  .dep-copy:active{transform:translateY(1px);}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
  <div class="wrap" id="app" hidden>
    <div class="deposit">
      <div class="dep-txt">💳 보증금 입금 · 카카오뱅크 <b>조여름 3333-32-7024720</b> <span class="dep-tag">(사물함)</span></div>
      <button class="dep-copy" id="depCopy">계좌 복사</button>
    </div>
    <header>
      <div class="mark">L</div>
      <div><h1>사물함 빈자리</h1><p>서면 YBM · 초록(빈자리)을 눌러 바로 신청하세요.</p></div>
    </header>

    <div class="tabs" id="tabs"></div>

    <div class="bar">
      <div class="cnt" id="cnt">—</div>
      <div class="lg">
        <span class="it"><span class="sw" style="background:#e3f3ec;border:1px solid #bfe3d2"></span>빈자리</span>
        <span class="it"><span class="sw" style="background:#fff3d6;border:1px solid #ecd28a"></span>신청중</span>
        <span class="it"><span class="sw" style="background:#eef1f4;border:1px solid #dde3ea"></span>사용중</span>
        <span class="it"><span class="sw" style="background:#e7eaef;border:1px solid #cfd5de"></span>고장</span>
      </div>
    </div>

    <div class="wall"><div class="grid" id="grid"></div></div>

    <div class="foot">
      <a class="rbtn" href="index.html" style="text-decoration:none;">← 처음</a>
      <button class="rbtn" id="refreshBtn">새로고침</button>
      <span id="stamp"></span>
    </div>
  </div>

  <div class="msg" id="msg">불러오는 중…</div>

  <!-- 신청 폼 -->
  <div class="ovl" id="applyView">
    <div class="sheet">
      <h2 id="apTitle">사물함 신청</h2>
      <p class="sub">아래 정보를 입력하고 신청하면 데스크에서 확인 후 확정됩니다.</p>
      <label>이름</label>
      <input id="apName" placeholder="이름" autocomplete="name" />
      <label>생년월일 (6자리)</label>
      <input id="apBirth" placeholder="예: 880130" inputmode="numeric" maxlength="6" />
      <label>전화번호</label>
      <input id="apPhone" placeholder="010-0000-0000" inputmode="tel" autocomplete="tel" />
      <label>보증금 환급받을 계좌</label>
      <input id="apAccount" placeholder="예: 카카오뱅크 3333-00-000000" />
      <p class="ferr" id="apErr"></p>
      <div class="sheet-btns">
        <button class="sbtn primary" id="apSubmit">신청하기</button>
        <button class="sbtn" id="apCancel">취소</button>
      </div>
    </div>
  </div>

  <!-- 신청 완료 -->
  <div class="ovl" id="doneView">
    <div class="sheet">
      <div class="done-ico">✓</div>
      <h2>신청 완료</h2>
      <p class="sub" id="doneText">신청이 접수되었습니다.</p>
      <p class="sub">데스크에서 확인 후 확정해 드립니다. 보증금은 아래 계좌로 입금해 주세요.</p>
      <div class="done-acct">카카오뱅크 <b>조여름 3333-32-7024720</b> (사물함)
        <button class="dep-copy" id="depCopy2" style="margin-left:8px;">복사</button>
      </div>
      <div class="sheet-btns"><button class="sbtn primary" id="doneClose">확인</button></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function () {
    "use strict";
    var URL = window.SUPABASE_URL, KEY = window.SUPABASE_ANON_KEY;
    var $ = function (id) { return document.getElementById(id); };
    if (!URL || !KEY || URL.indexOf("YOUR-") !== -1 || KEY.indexOf("YOUR-") !== -1) {
      $("msg").textContent = "설정이 필요합니다. config.js 에 Supabase 정보를 입력하세요.";
      return;
    }
    var sb = window.supabase.createClient(URL, KEY);

    var FLOORS = [
      { id: 1, name: "1관 1층", cols: 6, rows: 5, start: 1,   tallCount: 0 },
      { id: 2, name: "1관 2층", cols: 5, rows: 5, start: 31,  tallCount: 0 },
      { id: 3, name: "1관 3층", cols: 6, rows: 6, start: 56,  tallCount: 6 },
      { id: 4, name: "1관 4층", cols: 6, rows: 3, start: 92,  tallCount: 0 },
      { id: 7, name: "1관 7층", cols: 6, rows: 6, start: 1,   tallCount: 6 },
      { id: 8, name: "2관",     cols: 5, rows: 2, start: 110, tallCount: 0 }
    ];
    FLOORS.forEach(function (f) { f.total = f.cols * f.rows; f.end = f.start + f.total - 1; });

    var currentId = 1, STATUS = {}, loaded = false;
    function pad(n) { return String(n).padStart(2, "0"); }
    function keyOf(fid, n) { return fid + "-" + n; }
    function floorById(id) { return FLOORS.find(function (f) { return f.id === id; }); }
    function freeCount(f) { var c = 0; for (var n = f.start; n <= f.end; n++) if ((STATUS[keyOf(f.id, n)] || "free") === "free") c++; return c; }

    function renderTabs() {
      var t = $("tabs"); t.innerHTML = "";
      FLOORS.forEach(function (f) {
        var b = document.createElement("button");
        b.className = "tab" + (f.id === currentId ? " active" : "");
        b.innerHTML = '<span class="tn">' + f.name + '</span><span class="tc">빈 ' + freeCount(f) + "</span>";
        b.onclick = function () { currentId = f.id; render(); };
        t.appendChild(b);
      });
    }

    function renderGrid() {
      var f = floorById(currentId), g = $("grid");
      g.style.setProperty("--cols", f.cols);
      g.style.gridTemplateRows = "repeat(" + f.rows + ",1fr)";
      g.innerHTML = "";
      for (var i = 0; i < f.total; i++) {
        var n = f.start + i;
        var s = STATUS[keyOf(f.id, n)] || "free";
        var c = document.createElement("div");
        c.className = "cell " + s;
        c.innerHTML = '<span class="num">' + pad(n) + "</span>" +
          (s === "free" ? '<span class="cell-cta">신청</span>' : s === "pending" ? '<span class="cell-cta pend">신청중</span>' : s === "broken" ? '<span class="cell-cta brk">고장</span>' : "");
        if (s === "free") (function (num) { c.onclick = function () { openApply(f.id, num); }; })(n);
        g.appendChild(c);
      }
    }

    function renderBar() {
      var f = floorById(currentId);
      $("cnt").innerHTML = f.name + " 빈자리 <b>" + freeCount(f) + "</b> / " + f.total;
    }

    function render() { renderTabs(); renderBar(); renderGrid(); }

    function stamp() {
      var d = new Date();
      $("stamp").textContent = "업데이트 " + pad(d.getHours()) + ":" + pad(d.getMinutes());
    }

    function load() {
      return sb.from("locker_status").select("floor,number,occupied,pending,broken").then(function (res) {
        if (res.error) { if (!loaded) $("msg").textContent = "현황을 불러오지 못했습니다. 잠시 후 새로고침해 주세요."; return; }
        STATUS = {};
        (res.data || []).forEach(function (r) { STATUS[r.floor + "-" + r.number] = r.broken ? "broken" : r.occupied ? "used" : (r.pending ? "pending" : "free"); });
        if (!loaded) { loaded = true; $("msg").hidden = true; $("app").hidden = false; }
        render(); stamp();
      });
    }

    /* ---------- 사물함 신청 ---------- */
    var applyFid = 0, applyNum = 0;
    function openApply(fid, num) {
      applyFid = fid; applyNum = num;
      $("apTitle").textContent = floorById(fid).name + " " + pad(num) + "번 사물함 신청";
      $("apName").value = ""; $("apBirth").value = ""; $("apPhone").value = ""; $("apAccount").value = "";
      $("apErr").textContent = "";
      $("applyView").classList.add("open");
      setTimeout(function () { $("apName").focus(); }, 50);
    }
    function closeApply() { $("applyView").classList.remove("open"); }
    function submitApply() {
      var name = $("apName").value.trim();
      var birth = $("apBirth").value.trim();
      var phone = $("apPhone").value.trim();
      var account = $("apAccount").value.trim();
      var err = $("apErr");
      if (!name) { err.textContent = "이름을 입력하세요."; return; }
      if (!/^\d{6}$/.test(birth)) { err.textContent = "생년월일은 6자리 숫자로 입력하세요. (예: 880130)"; return; }
      if (!phone) { err.textContent = "전화번호를 입력하세요."; return; }
      if (!account) { err.textContent = "보증금 환급받을 계좌를 입력하세요."; return; }
      var btn = $("apSubmit"); btn.disabled = true; btn.textContent = "신청 중…";
      sb.from("requests").insert({ floor: applyFid, number: applyNum, student_name: name, birth: birth, phone: phone, refund_account: account })
        .then(function (res) {
          btn.disabled = false; btn.textContent = "신청하기";
          if (res.error) { err.textContent = "신청 실패: " + res.error.message; return; }
          closeApply();
          $("doneText").textContent = floorById(applyFid).name + " " + pad(applyNum) + "번 사물함을 신청했습니다.";
          $("doneView").classList.add("open");
          load();
        });
    }
    $("apCancel").onclick = closeApply;
    $("apSubmit").onclick = submitApply;
    $("doneClose").onclick = function () { $("doneView").classList.remove("open"); };
    $("depCopy2").onclick = function () {
      var num = "3333327024720", b = $("depCopy2");
      function done() { var t = b.textContent; b.textContent = "복사됨!"; setTimeout(function () { b.textContent = t; }, 1500); }
      function fb() { var ta = document.createElement("textarea"); ta.value = num; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(ta); }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(num).then(done, fb); } else { fb(); }
    };

    $("depCopy").onclick = function () {
      var num = "3333327024720"; // 계좌번호(숫자만) — 은행앱 붙여넣기 편하도록
      var btn = $("depCopy");
      function done() { var t = btn.textContent; btn.textContent = "복사됨!"; setTimeout(function () { btn.textContent = t; }, 1500); }
      function fb() { var ta = document.createElement("textarea"); ta.value = num; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} document.body.removeChild(ta); }
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(num).then(done, fb); } else { fb(); }
    };
    $("refreshBtn").onclick = function () { load(); };
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
    setInterval(function () { if (!document.hidden) load(); }, 30000);
    load();
  })();
  </script>
</body>
</html>
